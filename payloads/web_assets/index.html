<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CCTV co-worker</title>
    <link rel="stylesheet" href="static/report-template.css" />
    <link rel="stylesheet" href="static/style.css" />
    <script src="static/app.js" defer></script>
  </head>
  <body class="workspace-ui workspace-live">
    <a class="skip" href="#observations-title">Skip to observations</a>
    <main class="workspace-layout">
      <div class="workspace-primary">
        <section id="camera" class="video-stage" aria-label="Live video">
          <img
            id="camera-image"
            src="api/preview.mjpeg"
            alt="Current camera preview"
          />
          <div class="video-overlay">
            <span id="status" role="status">Preparing</span>
          </div>
          <p id="preview-state" role="status">Connecting to live video…</p>
        </section>
        <p id="error" class="workspace-alert" role="alert" hidden></p>
      </div>
      <section
        class="event-stream workspace-secondary"
        aria-labelledby="observations-title"
      >
        <div class="timeline-heading workspace-panel-heading">
          <h2 id="observations-title" tabindex="-1">
            Event stream <span id="caption-count">0</span>
          </h2>
          <div class="timeline-actions">
            <fieldset id="filters" class="workspace-segments">
              <legend>Show observations</legend>
              <label
                ><input type="radio" name="view" value="all" checked /><span
                  >Everything</span
                ></label
              >
              <label
                ><input type="radio" name="view" value="goal" /><span
                  >Goal matches</span
                ></label
              >
            </fieldset>
            <a
              class="workspace-button"
              href="api/export"
              aria-label="Export observations"
              download
              >Export</a
            >
          </div>
        </div>
        <p id="empty" class="workspace-empty">
          No completed video observations yet.
        </p>
        <div
          id="transcript"
          role="region"
          aria-label="Observation timeline, newest first"
          tabindex="0"
        >
          <ol id="captions"></ol>
        </div>
        <div class="timeline-navigation">
          <button id="latest" type="button" hidden>Back to latest</button
          ><button id="earlier" type="button" hidden>Show earlier</button>
        </div>
      </section>
    </main>
    <dialog id="evidence-dialog" aria-labelledby="evidence-title">
      <div class="evidence-heading workspace-panel-heading">
        <h2 id="evidence-title">Window snapshot</h2>
        <button id="close-evidence" type="button" autofocus>Close</button>
      </div>
      <figure>
        <img id="evidence-image" alt="" />
        <figcaption id="evidence-caption"></figcaption>
      </figure>
      <p id="evidence-description"></p>
    </dialog>
  </body>
</html>
